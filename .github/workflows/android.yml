name: Build Android app

# Builds the Cashless Edit APK on GitHub's free build machines and publishes it as a downloadable release.
on:
  push:
    branches: [main, master, "claude/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci

      - name: Build the on-device web app and sync it into the Android project
        run: npm run build:mobile

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease -PversionCode=${{ github.run_number }} --no-daemon --stacktrace
          cp app/build/outputs/apk/release/app-release.apk ../CashlessEdit.apk

      - uses: actions/upload-artifact@v4
        with:
          name: CashlessEdit-apk
          path: CashlessEdit.apk

      - name: Publish as a release (download it on your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v1.0.${{ github.run_number }}
          name: Cashless Edit for Android (build ${{ github.run_number }})
          make_latest: true
          files: CashlessEdit.apk
          body: |
            **Install on your Android phone**
            1. Tap **CashlessEdit.apk** below to download it.
            2. Open the downloaded file. If Android asks, allow your browser (or Files app) to "install unknown apps".
            3. Tap **Install**, then **Open**.

            Everything runs on your phone — no account, no subscription. New builds install over the old one and keep your manuscripts.
